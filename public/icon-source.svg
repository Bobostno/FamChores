<!--
  Master artwork for the PWA icon set.

  Colours come straight from the design tokens in src/app/globals.css and the
  themeColor in src/app/layout.tsx, so the installed icon matches the app chrome.
  Render the PNGs with `npm run icons` after editing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0912" />
      <stop offset="100%" stop-color="#12111f" />
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <!-- Mirrors the blur(90px) .aurora backdrop used behind every screen. -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Soft ambient glow, echoing the .aurora background behind every screen. -->
  <g filter="url(#glow)">
    <circle cx="110" cy="96" r="140" fill="#7c3aed" opacity="0.45" />
    <circle cx="410" cy="424" r="160" fill="#f97316" opacity="0.30" />
  </g>

  <!-- House: roof, body, door, two lit windows. -->
  <path d="M256 118 L400 236 L112 236 Z" fill="url(#roof)" />
  <rect x="144" y="236" width="224" height="164" rx="16" fill="#f5f2ec" />
  <rect x="232" y="308" width="48" height="92" rx="8" fill="#12111f" />
  <rect x="172" y="268" width="42" height="42" rx="8" fill="#f97316" opacity="0.92" />
  <rect x="298" y="268" width="42" height="42" rx="8" fill="#10b981" opacity="0.92" />
</svg>