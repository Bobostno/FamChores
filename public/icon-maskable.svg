<!--
  Maskable variant of the icon.

  Android crops a maskable icon to whatever shape the launcher uses (circle,
  squircle, rounded square), and it only guarantees the central 80% is safe.
  Artwork is therefore scaled to ~72% and centred so nothing important is
  clipped. Background fills the whole canvas, since the mask supplies the shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0912" />
      <stop offset="100%" stop-color="#12111f" />
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Kept well inside the 80% safe zone (centre 410px). -->
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <path d="M256 118 L400 236 L112 236 Z" fill="url(#roof)" />
    <rect x="144" y="236" width="224" height="164" rx="16" fill="#f5f2ec" />
    <rect x="232" y="308" width="48" height="92" rx="8" fill="#12111f" />
    <rect x="172" y="268" width="42" height="42" rx="8" fill="#f97316" opacity="0.92" />
    <rect x="298" y="268" width="42" height="42" rx="8" fill="#10b981" opacity="0.92" />
  </g>
</svg>